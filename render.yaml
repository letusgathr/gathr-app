services:
  - type: web
    name: gathr-app
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python db/database.py"
    startCommand: "python api_server.py"
    healthCheckPath: "/health"
    envVars:
      - key: PORT
        value: 10000
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
